[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiveq-sdk"
version = "0.3.7"
description = "Thin HiveQ Flow client SDK — author strategies and deploy backtests to the HiveQ platform. Ships type stubs + the deploy/observe client only (no engine)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HiveQ" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Thin client deps only — no engine, no polars.
# Deploy/observe is a direct REST transport (capture -> cloudpickle -> submit)
# built on requests + cloudpickle below; no platform-internal client package.
# Stubs for data_driver (hiveq.dd/driver/symbol/datetime) and hiveq_data are
# shipped so user code that references those imports resolves locally.
# quantstats + matplotlib power the visual tearsheet / summary_stats(); weasyprint
# is the bundled HTML->PDF backend for run.tearsheet() so PDF export works out of
# the box (a headless browser, if present, is used first for higher fidelity).
dependencies = [
    "pandas>=2.3.2",
    "colorlog==6.9.0",
    "requests>=2.25.0",
    "cloudpickle>=2.0.0",
    "tqdm>=4.0.0",
    "quantstats>=0.0.62",
    "matplotlib>=3.5.0",
    "weasyprint>=60",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "build", "twine"]

# Console entry points. `hiveq-data` uploads/lists files on the platform data
# store over REST (same code as hf.upload_files / hf.list_files); -u to upload
# (incremental, with a live progress bar), -l to list.
[project.scripts]
hiveq = "hiveq.cli:main"
hiveq-data = "hiveq.flow.uploads:main"
# `hiveq-login` signs the user in via the browser and saves their API key to
# ~/.hiveq/.env (same flow run_backtest triggers when no key is present).
hiveq-login = "hiveq.flow.auth:main"

# This distribution (`hiveq-sdk`) PROVIDES the `hiveq.flow` import namespace. It
# must NOT be co-installed with the full `hiveq-flow` package (same namespace) —
# use separate environments. Clients install this; the platform executor installs
# the full engine package.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the type stubs (.pyi) and the PEP 561 marker so authoring is typed.
"hiveq" = ["py.typed", "**/*.pyi", "docs/**/*.txt"]
"hiveq.flow" = ["py.typed", "**/*.pyi"]
"hiveq_data" = ["py.typed"]

[tool.setuptools]
include-package-data = true
